<p-dialog [(visible)]="visible" header="Cambiar contraseña" [modal]="true" [style]="{ width: '28rem' }" [breakpoints]="{ '640px': '94vw' }" [draggable]="false">
    <form #f="ngForm" (ngSubmit)="save(f)" id="changePwdForm" class="flex flex-col gap-5 pt-2" novalidate>
        @if (error()) {
            <p-message severity="error" [text]="error()!" styleClass="w-full" />
        }
        <div class="flex flex-col gap-2">
            <label for="currentPassword" class="font-medium">Contraseña actual</label>
            <p-password inputId="currentPassword" name="currentPassword" [(ngModel)]="current" #curCtrl="ngModel" [toggleMask]="true" [feedback]="false" [fluid]="true" required autocomplete="current-password" />
            <app-field-error [control]="curCtrl" [form]="f" />
        </div>
        <div class="flex flex-col gap-2">
            <label for="newPassword" class="font-medium">Nueva contraseña</label>
            <p-password inputId="newPassword" name="newPassword" [(ngModel)]="next" #nextCtrl="ngModel" [toggleMask]="true" [fluid]="true" required [minlength]="8" [maxlength]="72" autocomplete="new-password" />
            <app-field-error [control]="nextCtrl" [form]="f" />
            <small class="text-muted-color">Mínimo 8 caracteres.</small>
        </div>
        <div class="flex flex-col gap-2">
            <label for="confirmPassword" class="font-medium">Repite la nueva contraseña</label>
            <p-password inputId="confirmPassword" name="confirmPassword" [(ngModel)]="confirm" #confCtrl="ngModel" [toggleMask]="true" [feedback]="false" [fluid]="true" required autocomplete="new-password" />
            <app-field-error [control]="confCtrl" [form]="f" [customError]="confirm && confirm !== next ? 'Las contraseñas no coinciden' : null" />
        </div>
        <small class="text-muted-color"><i class="pi pi-info-circle mr-1"></i>Se cerrará tu sesión en los demás dispositivos.</small>
        <button type="submit" class="hidden" aria-hidden="true" tabindex="-1"></button>
    </form>
    <ng-template #footer>
        <p-button label="Cancelar" [text]="true" severity="secondary" (onClick)="visible.set(false)" />
        <p-button (onClick)="f.onSubmit($event)" label="Guardar" icon="pi pi-check" styleClass="gd-btn-gold" [loading]="saving()" />
    </ng-template>
</p-dialog>
