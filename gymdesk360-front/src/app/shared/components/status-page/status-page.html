<div class="min-h-screen flex items-center justify-center bg-surface-50 dark:bg-surface-950 px-6">
    <div class="text-center max-w-md">
        <app-logo [size]="56" />
        <div class="text-8xl font-extrabold gd-gold-text mt-6 leading-none">{{ code() }}</div>
        <div class="text-2xl font-bold text-surface-900 dark:text-surface-0 mt-4 mb-2">{{ title() }}</div>
        <div class="text-muted-color mb-8">{{ message() }}</div>
        <p-button label="Volver al inicio" icon="pi pi-home" routerLink="/" styleClass="gd-btn-gold" />
    </div>
</div>
