services:
  postgres:
    image: postgres:17-alpine
    container_name: gymdesk360-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gymdesk360}
      POSTGRES_USER: ${DB_USER:-gymdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gymdesk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: gymdesk360-demo-backend:latest
    container_name: gymdesk360-demo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-gymdesk360}
      DB_USER: ${DB_USER:-gymdesk}
      DB_PASSWORD: ${DB_PASSWORD:-gymdesk}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Modo demo: datos de ejemplo, login con un clic y reinicio diario
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "127.0.0.1:${APP_PORT:-8084}:8080"

volumes:
  pgdata:
