spring.application.name=gymdesk360

# Datasource (valores por defecto para correr local; en Docker se inyectan por env)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gymdesk360}
spring.datasource.username=${DB_USER:gymdesk}
spring.datasource.password=${DB_PASSWORD:gymdesk}

# JPA: el esquema lo maneja Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# El compose levanta tambien el backend, asi que se desactiva la integracion
# automatica de Spring Boot con Docker Compose (evita que la app se arranque a si misma)
spring.docker.compose.enabled=false

# Detras de Cloudflare Tunnel: respetar X-Forwarded-Proto/Host (https, IP real)
server.forward-headers-strategy=framework

# JWT (JWT_SECRET es obligatorio: openssl rand -base64 48)
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=gymdesk360
app.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:7d}

# CORS: origenes del frontend separados por coma
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200}

# Modo demo: datos de ejemplo, login con un clic y reinicio diario (BORRA la base; no usar con datos reales)
app.demo.enabled=${DEMO_ENABLED:false}
app.demo.reset-cron=${DEMO_RESET_CRON:0 30 4 * * *}

# Super admin inicial (solo se crea si no existe)
app.bootstrap.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.bootstrap.super-admin.password=${SUPER_ADMIN_PASSWORD:}

# Swagger (poner SWAGGER_ENABLED=false para ocultarlo)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
